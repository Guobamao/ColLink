<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="collink-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="32" height="32" rx="7.5" fill="url(#collink-bg)"/>

  <!-- Source Table Node Card (Left) -->
  <rect x="4.5" y="6.5" width="9" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="4.5" y="6.5" width="9" height="3.5" rx="2" fill="#DBEAFE"/>
  <line x1="4.5" y1="10" x2="13.5" y2="10" stroke="#93C5FD" stroke-width="0.8"/>
  <line x1="6" y1="12.5" x2="10" y2="12.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="15" x2="11" y2="15" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>

  <!-- Target Table Node Card (Right) -->
  <rect x="18.5" y="13.5" width="9" height="12" rx="2" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="18.5" y="13.5" width="9" height="3.5" rx="2" fill="#DBEAFE"/>
  <line x1="18.5" y1="17" x2="27.5" y2="17" stroke="#93C5FD" stroke-width="0.8"/>
  <line x1="20" y1="19.5" x2="25" y2="19.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="24" y2="22" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>

  <!-- Connecting Smooth Bezier Curve -->
  <path d="M 13.5 15 C 16 15, 16 22, 18.5 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Anchor Port Glowing Dots -->
  <circle cx="13.5" cy="15" r="1.6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/>
  <circle cx="18.5" cy="22" r="1.6" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.2"/>
  <circle cx="16" cy="18.5" r="1.2" fill="#60A5FA" filter="url(#glow)"/>
</svg>