[package]
name = "collink"
version = "1.0.0"
description = "ColLink - Data Lineage & Field Mapping Studio"
authors = ["ColLink Team"]
edition = "2021"

[lib]
name = "collink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "collink"
path = "src/main.rs"

[[bin]]
name = "collink-mcp"
path = "src/mcp_main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
sqlparser = "0.54"
regex = "1.11"
petgraph = "0.7"
rust_xlsxwriter = "0.80"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
dirs = "6.0"
base64 = "0.22"
